name: Sync release to Gitee

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to synchronize
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-release-to-gitee-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Gitee Release and assets
    runs-on: ubuntu-latest
    env:
      GITEE_REPOSITORY_URL: ${{ secrets.GITEE_REPOSITORY_URL }}
      GITEE_BRANCH: master
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Check Gitee token
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY_URL: ${{ secrets.GITEE_REPOSITORY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITEE_TOKEN}" ]]; then
            echo "::error::Missing required repository secret: GITEE_TOKEN"
            exit 1
          fi
          if [[ -z "${GITEE_REPOSITORY_URL}" ]]; then
            echo "::error::Missing required repository secret: GITEE_REPOSITORY_URL"
            exit 1
          fi

      - name: Check out the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Mirror a sanitized source snapshot
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY_URL: ${{ secrets.GITEE_REPOSITORY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0

          gitee_repository_url="${GITEE_REPOSITORY_URL%/}"
          gitee_repository_url="${gitee_repository_url%.git}"
          if [[ "${gitee_repository_url}" =~ ^(https://[^/]+)/([^/]+)/([^/?#]+)$ ]]; then
            gitee_host="${BASH_REMATCH[1]#https://}"
          else
            echo "::error::GITEE_REPOSITORY_URL must be an HTTPS repository URL"
            exit 1
          fi

          credential_file="${RUNNER_TEMP}/gitee-credentials"
          cleanup() {
            git config --local --unset-all credential.helper >/dev/null 2>&1 || true
            rm -f "${credential_file}"
          }
          trap cleanup EXIT

          git remote add gitee "${GITEE_REPOSITORY_URL}"
          git config --local credential.helper "store --file=${credential_file}"
          printf 'protocol=https\nhost=%s\nusername=oauth2\npassword=%s\n\n' \
            "${gitee_host}" \
            "${GITEE_TOKEN}" | git credential approve

          # Use the released tree but create a new root commit with a public
          # GitHub Actions identity. This keeps hidden-email commits out of
          # Gitee while preserving the source snapshot for OTA users.
          snapshot_tree="$(git rev-parse 'HEAD^{tree}')"
          snapshot_commit="$({
            export GIT_AUTHOR_NAME='github-actions[bot]'
            export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
            export GIT_COMMITTER_NAME='github-actions[bot]'
            export GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
            git commit-tree "${snapshot_tree}" -m "Sync ${RELEASE_TAG}"
          })"

          git push --force gitee \
            "${snapshot_commit}:refs/heads/${GITEE_BRANCH}" \
            "${snapshot_commit}:refs/tags/${RELEASE_TAG}"

      - name: Sync the Gitee Release and assets
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY_URL: ${{ secrets.GITEE_REPOSITORY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gitee_repository_url="${GITEE_REPOSITORY_URL%/}"
          gitee_repository_url="${gitee_repository_url%.git}"
          if [[ "${gitee_repository_url}" =~ ^(https://[^/]+)/([^/]+)/([^/?#]+)$ ]]; then
            gitee_base_url="${BASH_REMATCH[1]}"
            gitee_owner="${BASH_REMATCH[2]}"
            gitee_repo="${BASH_REMATCH[3]}"
          else
            echo "::error::GITEE_REPOSITORY_URL must be an HTTPS repository URL"
            exit 1
          fi
          gitee_api_url="${gitee_base_url}/api/v5/repos/${gitee_owner}/${gitee_repo}"

          event_file="${GITHUB_EVENT_PATH}"
          release_event_file=''
          release_response_file=''
          create_response_file=''
          asset_dir="$(mktemp -d)"
          response_file="$(mktemp)"
          existing_assets_file="$(mktemp)"
          gitee_release_file="$(mktemp)"
          expected_names_file="$(mktemp)"
          actual_names_file="$(mktemp)"
          cleanup() {
            rm -rf "${asset_dir}"
            rm -f "${response_file}" "${existing_assets_file}" \
              "${gitee_release_file}" "${expected_names_file}" \
              "${actual_names_file}"
            [[ -z "${release_event_file}" ]] || rm -f "${release_event_file}"
            [[ -z "${release_response_file}" ]] || rm -f "${release_response_file}"
            [[ -z "${create_response_file}" ]] || rm -f "${create_response_file}"
          }
          trap cleanup EXIT

          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            release_event_file="$(mktemp)"
            release_response_file="$(mktemp)"
            encoded_github_tag="$(jq -rn --arg value "${RELEASE_TAG}" '$value | @uri')"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              --output "${release_response_file}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_github_tag}"
            jq -e --arg tag "${RELEASE_TAG}" '.tag_name == $tag' \
              "${release_response_file}" >/dev/null
            jq '{release: .}' "${release_response_file}" >"${release_event_file}"
            event_file="${release_event_file}"
          fi

          release_name="$(jq -r '.release.name // .release.tag_name' "${event_file}")"
          release_body="$(jq -r '.release.body // ""' "${event_file}")"
          release_prerelease="$(jq -r '.release.prerelease // false' "${event_file}")"

          # Download the exact assets attached to the GitHub Release. The size
          # check prevents accidentally mirroring an API error response.
          while IFS=$'\t' read -r asset_name asset_url expected_size; do
            [[ -n "${asset_name}" ]] || continue
            case "${asset_name}" in
              */*|.|..)
                echo "::error::Unsupported release asset name: ${asset_name}"
                exit 1
                ;;
            esac

            asset_path="${asset_dir}/${asset_name}"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/octet-stream' \
              "${asset_url}" \
              --output "${asset_path}"

            actual_size="$(stat -c '%s' "${asset_path}")"
            if [[ "${expected_size}" != "-1" && "${actual_size}" != "${expected_size}" ]]; then
              echo "::error::Size mismatch for ${asset_name}: expected ${expected_size}, got ${actual_size}"
              exit 1
            fi
          done < <(
            jq -r '.release.assets[]? | [.name, .browser_download_url, (.size // -1)] | @tsv' \
              "${event_file}"
          )

          gitee_headers=(
            -H "Authorization: Bearer ${GITEE_TOKEN}"
            -H 'Accept: application/json'
          )
          release_tag="${RELEASE_TAG}"
          release_id=''
          create_release=false

          # The source snapshot above deliberately keeps GitHub's commit graph
          # out of Gitee, so private author emails cannot block this Release.

          release_status="$(curl --silent --show-error \
            "${gitee_headers[@]}" \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            "${gitee_api_url}/releases?per_page=100&page=1")"
          if [[ "${release_status}" != '200' ]] || \
            ! jq -e 'type == "array"' "${response_file}" >/dev/null; then
            echo "::error::Gitee Release list lookup failed with HTTP ${release_status}"
            sed -n '1,80p' "${response_file}"
            exit 1
          fi

          # The tag lookup endpoint can return JSON null even when a Release
          # exists. Find the Release in the list instead so retries are safe.
          release_id="$(jq -r --arg tag "${release_tag}" \
            '[.[] | select(.tag_name == $tag) | .id][0] // empty' \
            "${response_file}")"
          if [[ -n "${release_id}" ]]; then
            # Gitee currently returns HTTP 400 for updating an existing
            # Release through this endpoint. Keep its already-created
            # metadata and continue with the attachment reconciliation.
            echo "Using existing Gitee Release ${release_id}" >&2
          else
            create_release=true
          fi

          if [[ "${create_release}" == true ]]; then
            create_response_file="$(mktemp)"
            release_create_payload="$(jq -cn \
              --arg tag "${release_tag}" \
              --arg name "${release_name}" \
              --arg body "${release_body}" \
              --argjson prerelease "${release_prerelease}" \
              --arg target "${GITEE_BRANCH}" \
              '{tag_name: $tag, name: $name, body: $body, prerelease: $prerelease, target_commitish: $target}')"
            if ! create_status="$(curl --location --silent --show-error \
              --retry 3 --retry-all-errors \
              "${gitee_headers[@]}" \
              -H 'Content-Type: application/json' \
              --output "${create_response_file}" \
              --write-out '%{http_code}' \
              --request POST \
              --data "${release_create_payload}" \
              "${gitee_api_url}/releases")"; then
              echo "::error::Unable to contact Gitee while creating the Release"
              sed -n '1,120p' "${create_response_file}"
              exit 1
            fi
            if [[ "${create_status}" != 2* ]]; then
              echo "::error::Gitee Release creation failed with HTTP ${create_status}"
              sed -n '1,120p' "${create_response_file}"
              exit 1
            fi
            if ! release_id="$(jq -er '.id' "${create_response_file}")"; then
              echo "::error::Gitee Release creation returned no Release id"
              sed -n '1,120p' "${create_response_file}"
              exit 1
            fi
          fi

          # Re-runs are safe: replace all attachments of this same Release so
          # Gitee cannot retain an asset that was removed from GitHub.
          curl --fail --location --silent --show-error \
            "${gitee_headers[@]}" \
            --output "${existing_assets_file}" \
            "${gitee_api_url}/releases/${release_id}/attach_files?per_page=100"
          jq -e 'type == "array"' "${existing_assets_file}" >/dev/null
          while IFS=$'\t' read -r attachment_id attachment_name; do
            [[ -n "${attachment_id}" ]] || continue
            echo "Removing existing Gitee attachment: ${attachment_name}" >&2
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              "${gitee_headers[@]}" \
              --request DELETE \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              "${gitee_api_url}/releases/${release_id}/attach_files/${attachment_id}" \
              >/dev/null
          done < <(
            jq -r '.[] | select(.id != null) | [.id, (.name // "")] | @tsv' \
              "${existing_assets_file}"
          )

          while IFS=$'\t' read -r asset_name _asset_url _expected_size; do
            [[ -n "${asset_name}" ]] || continue
            echo "Uploading Gitee attachment: ${asset_name}" >&2
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              "${gitee_headers[@]}" \
              --request POST \
              --form-string "access_token=${GITEE_TOKEN}" \
              --form "file=@${asset_dir}/${asset_name};filename=${asset_name}" \
              "${gitee_api_url}/releases/${release_id}/attach_files" \
              >/dev/null
          done < <(
            jq -r '.release.assets[]? | [.name, .browser_download_url, (.size // -1)] | @tsv' \
              "${event_file}"
          )

          curl --fail --location --silent --show-error \
            "${gitee_headers[@]}" \
            --output "${gitee_release_file}" \
            "${gitee_api_url}/releases/${release_id}"
          test "$(jq -er '.tag_name' "${gitee_release_file}")" = "${release_tag}"

          curl --fail --location --silent --show-error \
            "${gitee_headers[@]}" \
            --output "${existing_assets_file}" \
            "${gitee_api_url}/releases/${release_id}/attach_files?per_page=100"
          jq -e 'type == "array"' "${existing_assets_file}" >/dev/null
          jq -r '.release.assets[]? | [.name, (.size // -1)] | @tsv' \
            "${event_file}" | LC_ALL=C sort >"${expected_names_file}"
          jq -r '.[] | [.name, (.size // -1)] | @tsv' \
            "${existing_assets_file}" | LC_ALL=C sort >"${actual_names_file}"
          echo "Verifying Gitee attachment names and sizes" >&2
          if ! diff -u "${expected_names_file}" "${actual_names_file}"; then
            echo "::error::Gitee release assets or sizes do not match the GitHub Release"
            exit 1
          fi

          echo "Synced ${release_tag} to the configured Gitee Release"
