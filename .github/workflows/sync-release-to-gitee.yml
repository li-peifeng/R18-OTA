name: Sync release to Gitee

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: sync-release-to-gitee-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror repository and release assets
    runs-on: ubuntu-latest
    env:
      GITEE_REPOSITORY_URL: ${{ secrets.GITEE_REPOSITORY_URL }}
      GITEE_BRANCH: master
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      SOURCE_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Check Gitee token
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY_URL: ${{ secrets.GITEE_REPOSITORY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITEE_TOKEN}" ]]; then
            echo "::error::Missing required repository secret: GITEE_TOKEN"
            exit 1
          fi
          if [[ -z "${GITEE_REPOSITORY_URL}" ]]; then
            echo "::error::Missing required repository secret: GITEE_REPOSITORY_URL"
            exit 1
          fi

      - name: Check out the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Mirror the source branch and tags
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY_URL: ${{ secrets.GITEE_REPOSITORY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0

          gitee_repository_url="${GITEE_REPOSITORY_URL%/}"
          gitee_repository_url="${gitee_repository_url%.git}"
          if [[ "${gitee_repository_url}" =~ ^(https://[^/]+)/([^/]+)/([^/?#]+)$ ]]; then
            gitee_host="${BASH_REMATCH[1]#https://}"
          else
            echo "::error::GITEE_REPOSITORY_URL must be an HTTPS repository URL"
            exit 1
          fi

          credential_file="${RUNNER_TEMP}/gitee-credentials"
          cleanup() {
            git config --local --unset-all credential.helper >/dev/null 2>&1 || true
            rm -f "${credential_file}"
          }
          trap cleanup EXIT

          git remote add gitee "${GITEE_REPOSITORY_URL}"
          git config --local credential.helper "store --file=${credential_file}"
          printf 'protocol=https\nhost=%s\nusername=oauth2\npassword=%s\n\n' \
            "${gitee_host}" \
            "${GITEE_TOKEN}" | git credential approve

          git fetch --no-tags origin \
            "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          git push --force gitee \
            "refs/remotes/origin/${SOURCE_BRANCH}:refs/heads/${GITEE_BRANCH}"
          git push --force gitee \
            'refs/tags/*:refs/tags/*'

      - name: Sync the Gitee Release and assets
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY_URL: ${{ secrets.GITEE_REPOSITORY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gitee_repository_url="${GITEE_REPOSITORY_URL%/}"
          gitee_repository_url="${gitee_repository_url%.git}"
          if [[ "${gitee_repository_url}" =~ ^(https://[^/]+)/([^/]+)/([^/?#]+)$ ]]; then
            gitee_base_url="${BASH_REMATCH[1]}"
            gitee_owner="${BASH_REMATCH[2]}"
            gitee_repo="${BASH_REMATCH[3]}"
          else
            echo "::error::GITEE_REPOSITORY_URL must be an HTTPS repository URL"
            exit 1
          fi
          gitee_api_url="${gitee_base_url}/api/v5/repos/${gitee_owner}/${gitee_repo}"

          event_file="${GITHUB_EVENT_PATH}"
          asset_dir="$(mktemp -d)"
          response_file="$(mktemp)"
          existing_assets_file="$(mktemp)"
          gitee_release_file="$(mktemp)"
          expected_names_file="$(mktemp)"
          actual_names_file="$(mktemp)"
          cleanup() {
            rm -rf "${asset_dir}"
            rm -f "${response_file}" "${existing_assets_file}" \
              "${gitee_release_file}" "${expected_names_file}" \
              "${actual_names_file}"
          }
          trap cleanup EXIT

          release_name="$(jq -r '.release.name // .release.tag_name' "${event_file}")"
          release_body="$(jq -r '.release.body // ""' "${event_file}")"
          release_prerelease="$(jq -r '.release.prerelease // false' "${event_file}")"

          # Download the exact assets attached to the GitHub Release. The size
          # check prevents accidentally mirroring an API error response.
          while IFS=$'\t' read -r asset_name asset_url expected_size; do
            [[ -n "${asset_name}" ]] || continue
            case "${asset_name}" in
              */*|.|..)
                echo "::error::Unsupported release asset name: ${asset_name}"
                exit 1
                ;;
            esac

            asset_path="${asset_dir}/${asset_name}"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/octet-stream' \
              "${asset_url}" \
              --output "${asset_path}"

            actual_size="$(stat -c '%s' "${asset_path}")"
            if [[ "${expected_size}" != "-1" && "${actual_size}" != "${expected_size}" ]]; then
              echo "::error::Size mismatch for ${asset_name}: expected ${expected_size}, got ${actual_size}"
              exit 1
            fi
          done < <(
            jq -r '.release.assets[]? | [.name, .browser_download_url, (.size // -1)] | @tsv' \
              "${event_file}"
          )

          gitee_headers=(
            -H "Authorization: Bearer ${GITEE_TOKEN}"
            -H 'Accept: application/json'
          )
          release_tag="${RELEASE_TAG}"
          encoded_tag="$(jq -rn --arg value "${release_tag}" '$value | @uri')"
          release_id=''

          release_status="$(curl --silent --show-error \
            "${gitee_headers[@]}" \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            "${gitee_api_url}/releases/tags/${encoded_tag}")"

          if [[ "${release_status}" == '200' ]]; then
            release_id="$(jq -er '.id' "${response_file}")"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              "${gitee_headers[@]}" \
              --request PATCH \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "name=${release_name}" \
              --data-urlencode "body=${release_body}" \
              --data "prerelease=${release_prerelease}" \
              "${gitee_api_url}/releases/${release_id}" \
              >/dev/null
          elif [[ "${release_status}" == '404' ]]; then
            create_response="$(curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              "${gitee_headers[@]}" \
              --request POST \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${release_tag}" \
              --data-urlencode "name=${release_name}" \
              --data-urlencode "body=${release_body}" \
              --data "prerelease=${release_prerelease}" \
              --data-urlencode "target_commitish=${GITEE_BRANCH}" \
              "${gitee_api_url}/releases")"
            release_id="$(jq -er '.id' <<<"${create_response}")"
          else
            echo "::error::Gitee release lookup failed with HTTP ${release_status}"
            sed -n '1,80p' "${response_file}"
            exit 1
          fi

          # Re-runs are safe: replace all attachments of this same Release so
          # Gitee cannot retain an asset that was removed from GitHub.
          curl --fail --location --silent --show-error \
            "${gitee_headers[@]}" \
            --output "${existing_assets_file}" \
            "${gitee_api_url}/releases/${release_id}/attach_files?per_page=100"
          jq -e 'type == "array"' "${existing_assets_file}" >/dev/null
          while IFS=$'\t' read -r attachment_id attachment_name; do
            [[ -n "${attachment_id}" ]] || continue
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              "${gitee_headers[@]}" \
              --request DELETE \
              "${gitee_api_url}/releases/${release_id}/attach_files/${attachment_id}" \
              >/dev/null
          done < <(
            jq -r '.[] | select(.id != null) | [.id, (.name // "")] | @tsv' \
              "${existing_assets_file}"
          )

          while IFS=$'\t' read -r asset_name _asset_url _expected_size; do
            [[ -n "${asset_name}" ]] || continue
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              "${gitee_headers[@]}" \
              --request POST \
              --form-string "access_token=${GITEE_TOKEN}" \
              --form "file=@${asset_dir}/${asset_name};filename=${asset_name}" \
              "${gitee_api_url}/releases/${release_id}/attach_files" \
              >/dev/null
          done < <(
            jq -r '.release.assets[]? | [.name, .browser_download_url, (.size // -1)] | @tsv' \
              "${event_file}"
          )

          curl --fail --location --silent --show-error \
            "${gitee_headers[@]}" \
            --output "${gitee_release_file}" \
            "${gitee_api_url}/releases/${release_id}"
          test "$(jq -er '.tag_name' "${gitee_release_file}")" = "${release_tag}"

          curl --fail --location --silent --show-error \
            "${gitee_headers[@]}" \
            --output "${existing_assets_file}" \
            "${gitee_api_url}/releases/${release_id}/attach_files?per_page=100"
          jq -e 'type == "array"' "${existing_assets_file}" >/dev/null
          jq -r '.release.assets[]? | [.name, (.size // -1)] | @tsv' \
            "${event_file}" | LC_ALL=C sort >"${expected_names_file}"
          jq -r '.[] | [.name, (.size // -1)] | @tsv' \
            "${existing_assets_file}" | LC_ALL=C sort >"${actual_names_file}"
          if ! diff -u "${expected_names_file}" "${actual_names_file}"; then
            echo "::error::Gitee release assets or sizes do not match the GitHub Release"
            exit 1
          fi

          echo "Synced ${release_tag} to the configured Gitee Release"
